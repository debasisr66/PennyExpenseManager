# Copy to PennyExpenseManager/.github/workflows/notify-studio.yml
# Requires secret STUDIO_DISPATCH_TOKEN: fine-grained PAT, repo access = debasisr66/studio only, Actions: Read and write.
name: Notify studio hub

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - 'README.md'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger studio sync
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.STUDIO_DISPATCH_TOKEN }}
          repository: debasisr66/studio
          event-type: product-updated
          client-payload: '{"source_repo":"${{ github.repository }}"}'
