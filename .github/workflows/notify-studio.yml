# Copy to PennyExpenseManager/.github/workflows/notify-studio.yml
# Requires secret STUDIO_DISPATCH_TOKEN: fine-grained PAT, repo access = debasisr66/studio only, Contents: Read and write.
name: Notify studio hub

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - 'README.md'

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger studio sync
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.STUDIO_DISPATCH_TOKEN }}
          repository: debasisr66/studio
          event-type: product-updated
          client-payload: '{"source_repo":"${{ github.repository }}"}'
