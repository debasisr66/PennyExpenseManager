name: Verify Penny
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for file in *.js tests/*.js tests/*.cjs; do node --check "$file" || exit 1; done
      - name: Regression and adversarial tests
        run: node --test tests/*.test.cjs
      - name: Docker build includes the complete test gate
        run: docker build -t penny-expense-manager:3.2.0 .
