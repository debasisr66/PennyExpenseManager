services:
  penny:
    build:
      context: .
    image: penny-expense-manager:3.2.0
    container_name: penny-expense-manager
    init: true
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

